<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onefly Order Monitoring System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.33.1/dist/globe.gl.min.js"></script>
</head>
<body>
  <div id="stars"></div>
  <div id="app">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg viewBox="0 0 40 40" width="38" height="38"><path d="M20 3a17 17 0 1 0 17 17h-7a10 10 0 1 1-10-10z" fill="none" stroke="#1fd1f9" stroke-width="4"/><path d="M24 8l12-4-4 12-3-5z" fill="#1fd1f9"/></svg>
          <span>onefly</span>
        </div>
        <nav class="control-toolbar" id="control-toolbar" aria-label="Dashboard controls">
          <div class="toolbar-group" role="group" aria-label="Layout presets">
            <button type="button" class="hud-btn toolbar-btn active" data-layout="classic" data-tooltip="Layout: Classic 3-Col (1)" aria-label="Classic 3-Column layout" aria-pressed="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2.5" y="4" width="19" height="16" rx="1.5" />
                <line x1="8" y1="4" x2="8" y2="20" />
                <line x1="16" y1="4" x2="16" y2="20" />
              </svg>
            </button>
            <button type="button" class="hud-btn toolbar-btn" data-layout="split" data-tooltip="Layout: Split Focus (2)" aria-label="Split Focus layout" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2.5" y="4" width="19" height="16" rx="1.5" />
                <line x1="12.5" y1="4" x2="12.5" y2="20" />
                <line x1="17" y1="4" x2="17" y2="20" />
              </svg>
            </button>
            <button type="button" class="hud-btn toolbar-btn" data-layout="dock" data-tooltip="Layout: Bottom Dock (3)" aria-label="Bottom Dock layout" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2.5" y="4" width="19" height="16" rx="1.5" />
                <line x1="2.5" y1="14" x2="21.5" y2="14" />
                <line x1="8.8" y1="14" x2="8.8" y2="20" />
                <line x1="15.2" y1="14" x2="15.2" y2="20" />
              </svg>
            </button>
          </div>
          <span class="toolbar-sep" aria-hidden="true"></span>
          <div class="toolbar-group" role="group" aria-label="Panel visibility">
            <button type="button" id="btn-toggle-left" class="hud-btn toolbar-btn active" data-tooltip="Hide Left Panels" aria-label="Toggle Left Panels" aria-pressed="true" aria-controls="col-left">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="1.5" />
                <rect x="3" y="4" width="6" height="16" rx="1" fill="currentColor" fill-opacity="0.28" />
                <line x1="9" y1="4" x2="9" y2="20" />
              </svg>
            </button>
            <button type="button" id="btn-toggle-kpis" class="hud-btn toolbar-btn active" data-tooltip="Hide KPI Bar" aria-label="Toggle KPI Bar" aria-pressed="true" aria-controls="kpis">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="1.5" />
                <rect x="3" y="4" width="18" height="5.5" rx="1" fill="currentColor" fill-opacity="0.28" />
                <line x1="3" y1="9.5" x2="21" y2="9.5" />
              </svg>
            </button>
            <button type="button" id="btn-toggle-right" class="hud-btn toolbar-btn active" data-tooltip="Hide Right Panels" aria-label="Toggle Right Panels" aria-pressed="true" aria-controls="col-right">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="1.5" />
                <rect x="15" y="4" width="6" height="16" rx="1" fill="currentColor" fill-opacity="0.28" />
                <line x1="15" y1="4" x2="15" y2="20" />
              </svg>
            </button>
            <button type="button" id="btn-toggle-zen" class="hud-btn toolbar-btn" data-tooltip="Zen Globe Mode (Z)" aria-label="Toggle Zen Globe Mode" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="5" />
                <ellipse cx="12" cy="12" rx="2.2" ry="5" />
                <line x1="7" y1="12" x2="17" y2="12" />
                <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" />
              </svg>
            </button>
          </div>
          <span class="toolbar-sep" aria-hidden="true"></span>
          <div class="toolbar-group" role="group" aria-label="Globe controls">
            <button type="button" id="btn-globe-rotate" class="hud-btn toolbar-btn active" data-tooltip="Pause Globe Rotation (R)" aria-label="Pause Globe Rotation" aria-pressed="true">
              <svg class="icon-rotating" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                <polyline points="21 3 21 8.5 15.5 8.5" />
                <line x1="10" y1="9.5" x2="10" y2="14.5" />
                <line x1="14" y1="9.5" x2="14" y2="14.5" />
              </svg>
              <svg class="icon-paused" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                <polyline points="21 3 21 8.5 15.5 8.5" />
                <polygon points="10.5,9 15.5,12 10.5,15" fill="currentColor" stroke="none" />
              </svg>
            </button>
            <button type="button" id="btn-globe-reset" class="hud-btn toolbar-btn" data-tooltip="Reset Globe View (0)" aria-label="Reset Globe Camera View">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="7" />
                <circle cx="12" cy="12" r="2" fill="currentColor" />
                <line x1="12" y1="2" x2="12" y2="5" />
                <line x1="12" y1="19" x2="12" y2="22" />
                <line x1="2" y1="12" x2="5" y2="12" />
                <line x1="19" y1="12" x2="22" y2="12" />
              </svg>
            </button>
          </div>
        </nav>
        <div class="header-line left"><i></i></div>
      </div>
      <div class="title-wrap">
        <h1 class="title">Onefly Order Monitoring System</h1>
      </div>
      <div class="header-right">
        <div class="header-line right"><i></i></div>
        <div class="header-info">
          <div class="hotline">Hotline <b>1900 6868</b></div>
          <div class="clock"><span id="clock-time">--:--:--</span><small id="clock-date">----</small></div>
          <div class="header-actions">
            <button type="button" id="btn-snapshot" class="hud-btn" data-tooltip="Capture Snapshot (PNG)" aria-label="Capture Snapshot">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                <circle cx="12" cy="13" r="4" />
              </svg>
            </button>
            <button type="button" id="btn-fullscreen" class="hud-btn" data-tooltip="Enter Fullscreen (F)" aria-label="Enter Fullscreen" aria-pressed="false">
              <svg class="icon-enter" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 3H5a2 2 0 0 0-2 2v3" />
                <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
                <path d="M3 16v3a2 2 0 0 0 2 2h3" />
                <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
              </svg>
              <svg class="icon-exit" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 3v3a2 2 0 0 1-2 2H3" />
                <path d="M21 8h-3a2 2 0 0 1-2-2V3" />
                <path d="M3 16h3a2 2 0 0 1 2 2v3" />
                <path d="M16 21v-3a2 2 0 0 1 2-2h3" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- KPI -->
    <section class="kpis" id="kpis">
      <div class="kpi big"><label>Order Sales Amount</label><div class="val" id="kpi-sales">$0</div></div>
      <div class="kpi"><label>Available Routes</label><div class="val" id="kpi-routes">0</div></div>
      <div class="kpi"><label>Covered Airports</label><div class="val" id="kpi-airports">0</div></div>
      <div class="kpi"><label>Partner Airlines</label><div class="val" id="kpi-airlines">0</div></div>
      <div class="kpi"><label>Covered Countries / Regions</label><div class="val" id="kpi-countries">0</div></div>
    </section>

    <!-- BODY -->
    <main class="body">
      <aside class="col left" id="col-left">
        <div class="panel" style="height:300px">
          <div class="panel-title"><span>Global Route Distribution</span></div>
          <div class="dist">
            <div class="legend" id="legend-left"></div>
            <div id="donut"></div>
            <div class="legend" id="legend-right"></div>
          </div>
        </div>
        <div class="panel grow">
          <div class="panel-title panel-title--records">
            <span>Route Booking Records</span>
            <div class="live-controls">
              <em class="live" id="live-badge" aria-live="polite"><i></i><b class="live-text">LIVE</b></em>
              <button type="button" id="btn-live-toggle" class="panel-btn" title="Pause Live Stream" aria-label="Pause Live Stream" aria-pressed="false">
                <svg class="icon-pause" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
                  <rect x="6" y="4" width="4" height="16" rx="1" />
                  <rect x="14" y="4" width="4" height="16" rx="1" />
                </svg>
                <svg class="icon-play" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
                  <polygon points="6,4 20,12 6,20" />
                </svg>
              </button>
            </div>
          </div>
          <div class="records-toolbar">
            <div class="search-wrap">
              <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input type="text" id="route-search" class="search-input" placeholder="Filter route or airport (e.g. BKK, SIN)..." aria-label="Filter booking rows by route or airport code" autocomplete="off" spellcheck="false" />
              <button type="button" id="btn-clear-search" class="search-clear" title="Clear filter" aria-label="Clear filter" hidden>&times;</button>
            </div>
            <div class="records-count" id="records-count" aria-live="polite"></div>
          </div>
          <div class="table-head"><span>Route</span><span>Departure Time</span><span>Order Time</span></div>
          <div class="table-body" id="table-body"><div id="rows"></div></div>
        </div>
      </aside>

      <section class="center">
        <div id="globe"></div>
        <div class="globe-ring"></div>
        <div class="globe-caption" id="globe-caption" role="group" aria-label="Region Filter">
          <span><i style="background:#ffcc33"></i>Asia</span>
          <span><i style="background:#2eff7a"></i>Europe</span>
          <span><i style="background:#ff2e88"></i>Americas</span>
          <span><i style="background:#ff781f"></i>Mideast</span>
          <span><i style="background:#c85bff"></i>Africa</span>
          <span><i style="background:#a8ff35"></i>Oceania</span>
        </div>
      </section>

      <aside class="col right" id="col-right">
        <div class="panel" style="height:430px">
          <div class="panel-title"><span>Top 10 Airlines by Orders</span></div>
          <div id="bars"></div>
        </div>
        <div class="panel grow">
          <div class="panel-title">
            <span id="routes-title">Top Routes – Asia</span>
            <button type="button" id="btn-reset-region" class="filter-reset-pill" hidden title="Show All Regions" aria-label="Reset region filter">Reset ✕</button>
          </div>
          <div id="top-routes"></div>
        </div>
      </aside>
    </main>

    <button type="button" id="btn-zen-restore" class="btn-zen-restore" title="Exit Zen Mode (Z / Esc)" aria-label="Exit Zen Mode" aria-hidden="true" tabindex="-1">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <line x1="9" y1="4" x2="9" y2="20" />
        <line x1="15" y1="4" x2="15" y2="20" />
        <line x1="3" y1="9" x2="21" y2="9" />
      </svg>
      <span>Exit Zen</span>
      <kbd>Z</kbd>
    </button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
