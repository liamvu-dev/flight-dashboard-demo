name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JS syntax
        run: |
          for f in js/*.js; do
            echo "Checking $f..."
            node --check "$f"
          done

      - name: Verify required files & HTML references
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/data.js
          test -f js/main.js
          grep -q 'js/main.js' index.html
          grep -q 'css/style.css' index.html
